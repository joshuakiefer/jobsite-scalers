<script>
"use strict";
// paste your booking calendar link here
var CAL_URL = "";
if (CAL_URL) document.getElementById("ctaBtn").href = CAL_URL;
else document.getElementById("ctaBtn").addEventListener("click", function (e) { e.preventDefault(); });
var f = document.getElementById("demo");
f.addEventListener("load", function () { try { f.contentWindow.focus(); } catch (e) {} });
window.addEventListener("keydown", function (e) {
  if (document.activeElement === f) return; // focus is inside; the demo already got it
  try {
    var d = f.contentDocument;
    if (d) d.dispatchEvent(new KeyboardEvent("keydown", { key: e.key, bubbles: true }));
  } catch (err) {}
});
</script>
